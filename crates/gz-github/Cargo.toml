[package]
name = "gz-github"
description = "The network side of the release tools: GitHub releases and the account token, the Mod Browser catalog's issues, VirusTotal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gz-editor.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
tokio.workspace = true
sha2.workspace = true
hex.workspace = true
# the Windows proxy settings apply, as WinHTTP's automatic proxy did
reqwest = { workspace = true, features = ["system-proxy"] }
getrandom = "0.3"
zeroize = "1"

# The Credential Manager under the editor's own target names (`GrizzlyEditor:GitHub`), which
# the `keyring` facade cannot name: its store, used directly.
[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = { version = "1", default-features = false }
