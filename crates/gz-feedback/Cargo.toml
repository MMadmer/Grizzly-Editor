[package]
name = "gz-feedback"
description = "The editor's feedback to its author: bug reports, suggestions and crash reports with an anonymous diagnostic package, sent to the report hub."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
gz-base.workspace = true
gz-editor.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
sha2.workspace = true
hex.workspace = true
flate2.workspace = true
crc32fast = "1"
time.workspace = true
# the report hub over HTTPS; the Windows proxy settings apply
reqwest = { workspace = true, features = ["system-proxy"] }

[target.'cfg(windows)'.dependencies]
gz-win.workspace = true

[dev-dependencies]
tempfile.workspace = true
